<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARO AI — सोचो तुम, बनाएगा KARO!</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(145deg,#090b20,#17113a 55%,#101d3d);color:#fff;min-height:100vh}
main{max-width:760px;margin:auto;padding:28px 18px 60px}.brand{font-size:30px;font-weight:900;letter-spacing:1px}.brand span{color:#a78bfa}.tag{color:#c4b5fd;margin:4px 0 34px}.hero{font-size:clamp(30px,7vw,48px);line-height:1.12;margin:0 0 12px}.sub{color:#cbd5e1;margin-bottom:24px}
.panel{background:#ffffff10;border:1px solid #ffffff24;border-radius:22px;padding:20px}.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}button{border:0;border-radius:13px;padding:13px;background:#30275c;color:white;font-weight:700;font-size:15px;cursor:pointer}button.active{background:linear-gradient(90deg,#7c3aed,#2563eb);outline:2px solid #c4b5fd}
label{display:block;font-weight:700;margin:0 0 10px}textarea{width:100%;min-height:125px;border-radius:13px;padding:14px;border:1px solid #ffffff30;background:#090d25;color:white;font:inherit;resize:vertical}#go{width:100%;margin-top:14px;background:linear-gradient(90deg,#9333ea,#2563eb);padding:15px}#result{white-space:pre-wrap;line-height:1.65;color:#f8fafc;margin-top:18px}#copy{display:none;margin-top:12px;background:#334155}.hint{font-size:12px;color:#a5b4fc;margin-top:18px}@media(min-width:600px){.tools{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main><div class="brand">KARO <span>AI</span></div><div class="tag">सोचो तुम, बनाएगा KARO!</div><h1 class="hero">आपका आइडिया।<br>AI की ताकत।</h1><p class="sub">भारत के creators के लिए आसान AI tools</p>
<section class="panel"><label>पहले टूल चुनें</label><div class="tools"><button class="active" data-tool="reel">रील स्क्रिप्ट</button><button data-tool="news">न्यूज़ राइटर</button><button data-tool="caption">कैप्शन</button><button data-tool="ideas">कंटेंट आइडिया</button></div><label for="topic">आप क्या बनाना चाहते हैं?</label><textarea id="topic" placeholder="अपना विषय यहाँ लिखें..."></textarea><button id="go">✨ AI से बनाएं</button><div id="result" aria-live="polite"></div><button id="copy">कॉपी करें</button><div class="hint">KARO AI शुरुआती टेस्ट संस्करण · AI उपयोग पर शुल्क लग सकता है।</div></section></main>
<script>
let selected="reel";document.querySelectorAll("[data-tool]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-tool]").forEach(x=>x.classList.remove("active"));b.classList.add("active");selected=b.dataset.tool;}));
const go=document.getElementById("go"),result=document.getElementById("result"),copy=document.getElementById("copy");
go.addEventListener("click",async()=>{const topic=document.getElementById("topic").value.trim();if(topic.length<3){result.textContent="पहले अपना विषय लिखें।";return;}go.disabled=true;go.textContent="AI बना रहा है…";result.textContent="कृपया इंतज़ार करें…";copy.style.display="none";try{const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tool:selected,topic})});const data=await r.json();if(!r.ok)throw new Error(data.error||"कुछ गड़बड़ हुई।");result.textContent=data.text;copy.style.display="inline-block";}catch(e){result.textContent=e.message;}finally{go.disabled=false;go.textContent="✨ AI से बनाएं";}});
copy.addEventListener("click",async()=>{await navigator.clipboard.writeText(result.textContent);copy.textContent="कॉपी हो गया ✓";setTimeout(()=>copy.textContent="कॉपी करें",1500);});
</script></body></html>
